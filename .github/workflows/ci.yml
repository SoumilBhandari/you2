name: gates

# The badge this produces is the point. A build badge that links to nothing is
# decoration; this one goes red when the prose stops matching the model, which
# is how every defect in this repo has actually arrived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"      # Mondays, 04:17 UTC

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        working-directory: software
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        working-directory: software
        run: python -m pytest -q

  gates:
    name: cad gates
    runs-on: ubuntu-latest
    # Measured on this runner: 54 seconds for the whole job, of which 36 is
    # fetching and extracting OpenSCAD and 11 is the four gates. The one that
    # had been running for four hours and twenty minutes now takes 7 seconds.
    # The cap is not a guess at how slow a shared runner might be, it is a
    # tripwire: if a future OpenSCAD stops defaulting to Manifold these gates
    # go back to taking hours, and they should fail at 15 minutes saying so
    # rather than squat on the queue until the 6-hour job default kills them.
    # See the long note in .github/actions/openscad for the first version.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/openscad
      - name: numpy
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24"

      # The prose gate. Under a second, and the one that has caught the most:
      # thirty wrong claims across six documents so far.
      - name: the documents agree with the model
        run: python3 cad/docs.py --quick

      # Every part is one connected solid. This is the check rev C would have
      # failed. The DEFAULT variant only — see the note on the nightly job.
      - name: every part is one solid
        run: python3 cad/check.py cad/you2-revD.scad

      - name: no two parts share space
        run: python3 cad/fit.py cad/you2-revD.scad

      - name: no part claims an impossible mass
        run: python3 cad/mass.py cad/you2-revD.scad

  # The exhaustive sweep, on a schedule instead of on every push.
  #
  # The first version ran `check.py --variants` and a 6000-ray thickness pass
  # per push. That is 55 OpenSCAD exports plus ray-casting 70k facets eight
  # times, and it was still going at 24 minutes on a shared runner while four
  # more pushes queued behind it. CI nobody waits for is CI nobody reads, which
  # is the same failure as the pre-commit hook that costs two minutes.
  #
  # Nothing is dropped, only moved. The variant sweep catches a configuration
  # that stops building, which is a thing that happens over weeks, not between
  # two commits on a Tuesday.
  sweep:
    name: full sweep (nightly)
    # Schedule and manual ONLY. `!= pull_request` still let it run on every
    # push, which is the thing this split exists to stop.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/openscad
      - name: numpy
        run: pip install "numpy>=1.24"

      - name: every part is one solid, under every switch
        run: python3 cad/check.py cad/you2-revD.scad --variants

      - name: no wall a 0.4 mm nozzle cannot fill
        run: python3 cad/thickness.py cad/you2-revD.scad --rays 6000
