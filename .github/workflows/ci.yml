name: gates

# The badge this produces is the point. A build badge that links to nothing is
# decoration; this one goes red when the prose stops matching the model, which
# is how every defect in this repo has actually arrived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"      # Mondays, 04:17 UTC

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        working-directory: software
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        working-directory: software
        run: python -m pytest -q

  gates:
    name: cad gates
    runs-on: ubuntu-latest
    # Measured on this runner, every step below plus setup: about two minutes.
    # The cap is not a guess at how slow a shared runner might be, it is a
    # tripwire. Ubuntu's own OpenSCAD package does booleans with CGAL Nef
    # polyhedra and `fit.py` was still running on it at four hours and twenty
    # minutes; if a future upstream build stops defaulting to Manifold these
    # gates go back to that, and they should fail at 15 minutes saying so
    # rather than squat on the queue until the 6-hour job default kills them.
    # See the long note in .github/actions/openscad.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/openscad
      - name: numpy
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24"

      # The prose gate, in full rather than --quick: the four mesh-derived
      # claims (bed contact, downfacing area) cost a couple of seconds here
      # and are the ones nobody can check by eye. 1 s.
      - name: the documents agree with the model
        run: python3 cad/docs.py

      # --variants, not the default alone. LED_BAR = true was broken for as
      # long as it existed because only one configuration was ever gated. 13 s.
      - name: every part is one solid, under every switch
        run: python3 cad/check.py cad/you2-revD.scad --variants

      - name: no two parts share space
        run: python3 cad/fit.py cad/you2-revD.scad

      - name: no part claims an impossible mass
        run: python3 cad/mass.py cad/you2-revD.scad

      # 57 s, and the slowest thing here by a factor of four. It stays on the
      # push path anyway: a 0.3 mm web is the classic FDM failure and it is
      # invisible to every other gate, because the part is still one solid and
      # still does not intersect anything.
      - name: no wall a 0.4 mm nozzle cannot fill
        run: python3 cad/thickness.py cad/you2-revD.scad --rays 6000

# Why there is no separate nightly job any more
# --------------------------------------------
# There was one, holding `check.py --variants` and the 6000-ray wall pass,
# because together they were "still going at 24 minutes" on a shared runner.
# That measurement was taken against Ubuntu's OpenSCAD 2021.01 and it was a
# property of the boolean backend, not of the gates. On the pinned upstream
# build the same two steps are 13 s and 57 s, so the whole suite now runs on
# every push and nothing is deferred.
#
# The weekly schedule above is kept for a different reason that is still true:
# the OpenSCAD AppImage is pinned to a dated snapshot, upstream keeps those for
# about a year, and a repo nobody has pushed to for a month should still find
# out that its pin has 404'd.
