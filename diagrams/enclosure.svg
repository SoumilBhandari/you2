<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    :root { color-scheme: light dark; }
    .bg{fill:#fbfbfa} .body{fill:#fff;stroke:#1a1a1a;stroke-width:2}
    .glass{fill:#14181d;stroke:#1a1a1a;stroke-width:1.3}
    .bar{fill:#e8a13a;stroke:#b8801f;stroke-width:.9}
    .part{fill:#dfe6ea;stroke:#1a1a1a;stroke-width:1.1}
    .pcb{fill:#2f6f43;stroke:#1a1a1a;stroke-width:1.1;opacity:.85}
    .hid{fill:none;stroke:#1a1a1a;stroke-width:.9;stroke-dasharray:5 4;opacity:.5}
    .cl{stroke:#c0392b;stroke-width:.8;stroke-dasharray:12 3 2 3;opacity:.5}
    .dim{stroke:#6a6a6a;stroke-width:.9}
    .t{fill:#1a1a1a;font-size:12.5px} .td{fill:#6a6a6a;font-size:11px}
    .ttl{fill:#1a1a1a;font-size:21px;letter-spacing:3px}
    .sub{fill:#6a6a6a;font-size:11px;letter-spacing:1.5px}
    .num{fill:#fbfbfa;font-size:11.5px;font-weight:700} .badge{fill:#1a1a1a}
    .fr{fill:none;stroke:#1a1a1a;stroke-width:1.3}
    @media (prefers-color-scheme: dark){
      .bg{fill:#101215} .body{fill:#1b1f24;stroke:#e7e7e5} .glass{fill:#05070a;stroke:#e7e7e5}
      .part{fill:#2c3339;stroke:#e7e7e5} .pcb{stroke:#e7e7e5} .hid{stroke:#e7e7e5}
      .dim{stroke:#9aa0a6} .t,.ttl{fill:#e7e7e5} .td,.sub{fill:#9aa0a6}
      .num{fill:#101215} .badge{fill:#e7e7e5} .fr{stroke:#e7e7e5}
    }
    :root[data-theme="dark"] .bg{fill:#101215}
    :root[data-theme="dark"] .body{fill:#1b1f24;stroke:#e7e7e5}
    :root[data-theme="dark"] .glass{fill:#05070a;stroke:#e7e7e5}
    :root[data-theme="dark"] .part{fill:#2c3339;stroke:#e7e7e5}
    :root[data-theme="dark"] .pcb{stroke:#e7e7e5}
    :root[data-theme="dark"] .hid{stroke:#e7e7e5}
    :root[data-theme="dark"] .dim{stroke:#9aa0a6}
    :root[data-theme="dark"] .t,:root[data-theme="dark"] .ttl{fill:#e7e7e5}
    :root[data-theme="dark"] .td,:root[data-theme="dark"] .sub{fill:#9aa0a6}
    :root[data-theme="dark"] .num{fill:#101215}
    :root[data-theme="dark"] .badge{fill:#e7e7e5}
    :root[data-theme="dark"] .fr{stroke:#e7e7e5}
    :root[data-theme="light"] .bg{fill:#fbfbfa}
  </style>
  <defs>
    <marker id="a"  markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#6a6a6a"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#6a6a6a"/></marker>
    <pattern id="mesh" width="8" height="6.9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="1.7" r="1.6" fill="#1a1a1a" opacity=".5"/>
      <circle cx="6" cy="5.2" r="1.6" fill="#1a1a1a" opacity=".5"/>
    </pattern>
  </defs>

  <rect class="bg" width="1100" height="700"/>
  <text class="ttl" x="50" y="48">Y O U 2</text>
  <text class="sub" x="50" y="67">DESK UNIT · REV C · mm · 1.6 px/mm · GEOMETRY VERIFIED IN OPENSCAD, MANIFOLD, NoError</text>
  <line class="fr" x1="50" y1="82" x2="1050" y2="82"/>

  <!-- ═══ FRONT ELEVATION ═══ 134w x 165h → 214.4 x 264 -->
  <g transform="translate(92,118)">
    <text class="sub" x="0" y="-12">FRONT ELEVATION</text>
    <rect class="body" x="0" y="0" width="214.4" height="264" rx="14.4"/>
    <line class="cl" x1="107.2" y1="-8" x2="107.2" y2="276"/>

    <!-- carrier 115 sq, hidden. along-face 115 → 109.4 in z → 175 px -->
    <rect class="hid" x="15.2" y="7.7" width="184" height="175"/>
    <!-- glass Ø87.6 → r 70.1 , foreshortened ry 66.7 ; centre z=105.5 → y 95.2 -->
    <ellipse class="glass" cx="107.2" cy="95.2" rx="70.1" ry="66.7"/>
    <ellipse cx="107.2" cy="95.2" rx="70.1" ry="66.7" fill="none" stroke="#3a4a5a" stroke-width="1" opacity=".5"/>

    <!-- shoulder at z=46 -->
    <line class="dim" x1="0" y1="190.4" x2="214.4" y2="190.4" stroke-dasharray="3 3" opacity=".55"/>
    <!-- LED bar: on the SKIRT at z=40, 102 long -->
    <rect class="bar" x="25.6" y="196.8" width="163.2" height="7.2" rx="3"/>
    <!-- speaker grille Ø33 field at z=18 -->
    <circle cx="107.2" cy="235.2" r="26.4" fill="url(#mesh)"/>
    <circle class="hid" cx="107.2" cy="235.2" r="28.8"/>
    <!-- mic ports, top face, hidden -->
    <g class="hid"><circle cx="107.2" cy="5" r="2.6"/><circle cx="60.8" cy="5" r="2.6"/><circle cx="153.6" cy="5" r="2.6"/></g>

    <line class="dim" x1="0" y1="292" x2="214.4" y2="292" marker-start="url(#a2)" marker-end="url(#a)"/>
    <text class="td" x="107.2" y="309" text-anchor="middle">134.0</text>
    <line class="dim" x1="-26" y1="0" x2="-26" y2="264" marker-start="url(#a2)" marker-end="url(#a)"/>
    <text class="td" x="-34" y="136" text-anchor="middle" transform="rotate(-90,-34,136)">165.0</text>

    <line class="dim" x1="176" y1="52" x2="258" y2="28"/><text class="td" x="262" y="26">⌀87.6 GLASS · 800×800</text>
    <line class="dim" x1="196" y1="120" x2="258" y2="104"/><text class="td" x="262" y="102">115 × 115 CARRIER · 5.1 CLEAR</text>
    <line class="dim" x1="188" y1="200" x2="258" y2="182"/><text class="td" x="262" y="180">102 LED BAR</text>
    <line class="dim" x1="134" y1="248" x2="258" y2="238"/><text class="td" x="262" y="236">⌀36 GRILLE · SEALED CHAMBER</text>
  </g>

  <!-- ═══ SIDE ELEVATION ═══ 125d x 165h → 200 x 264 ; setback 38.7 → 61.9 ; skirt 73.6 -->
  <g transform="translate(640,118)">
    <text class="sub" x="0" y="-12">SIDE ELEVATION — FRONT AT LEFT</text>
    <path class="body" d="
      M 7,264 L 193,264 Q 200,264 200,257 L 200,7 Q 200,0 193,0
      L 69,0 Q 62,0 59,5.6 L 4,185 Q 0,192 0,198 L 0,257 Q 0,264 7,264 Z"/>
    <line class="dim" x1="-12" y1="264" x2="224" y2="264" stroke-dasharray="4 4"/>

    <!-- display edge-on, centred on the raked face -->
    <g transform="translate(41,95.2) rotate(18)">
      <rect class="glass" x="-70.1" y="-3.5" width="140.2" height="7" rx="2"/>
      <rect class="part"  x="-92"   y="3.5"  width="184"   height="10.4" rx="2"/>
      <text class="td" x="100" y="6">DSI PANEL + CARRIER</text>
    </g>

    <!-- skirt: LED bar then speaker chamber -->
    <rect class="bar" x="2" y="196" width="8" height="7" rx="2"/>
    <path class="part" d="M 3,208 L 52,208 L 52,260 L 3,260 Z" opacity=".4"/>
    <path class="part" d="M 3,224 L 7,224 L 7,248 L 3,248 Z"/>
    <path class="part" d="M 7,220 L 36,229 L 36,243 L 7,252 Z"/>
    <text class="td" x="58" y="240">SEALED CHAMBER</text>

    <rect class="part" x="62" y="3.5" width="117" height="3.5" rx="1.5"/>
    <text class="td" x="72" y="22">4-MIC FPC ARRAY ⌀73</text>

    <rect class="part" x="96" y="245" width="7" height="10"/>
    <rect class="part" x="174" y="245" width="7" height="10"/>
    <rect class="pcb"  x="80"  y="240" width="114" height="5"/>
    <text class="td" x="84" y="236">PI 5</text>

    <g stroke="#1a1a1a" stroke-width="3.2" stroke-linecap="round" opacity=".5">
      <line x1="196" y1="60" x2="196" y2="98"/><line x1="196" y1="176" x2="196" y2="214"/>
    </g>
    <text class="td" x="208" y="74">EXHAUST</text><text class="td" x="208" y="200">INTAKE</text>

    <line class="cl" x1="69" y1="-10" x2="69" y2="50"/>
    <path class="dim" d="M 69,40 A 40,40 0 0 0 58,7" fill="none"/><text class="td" x="78" y="38">18°</text>

    <line class="dim" x1="0" y1="292" x2="200" y2="292" marker-start="url(#a2)" marker-end="url(#a)"/>
    <text class="td" x="100" y="309" text-anchor="middle">125.0</text>
    <line class="dim" x1="0" y1="-24" x2="61.9" y2="-24" marker-start="url(#a2)" marker-end="url(#a)"/>
    <text class="td" x="31" y="-30" text-anchor="middle">38.7</text>
    <line class="dim" x1="-20" y1="190.4" x2="-20" y2="264" marker-start="url(#a2)" marker-end="url(#a)"/>
    <text class="td" x="-28" y="228" text-anchor="middle" transform="rotate(-90,-28,228)">46</text>
  </g>

  <!-- ═══ NOTES ═══ -->
  <g transform="translate(50,462)">
    <line class="fr" x1="0" y1="0" x2="1000" y2="0"/>
    <text class="sub" x="0" y="22">WHAT THE PARTS FORCED</text>

    <g transform="translate(0,42)">
      <circle class="badge" cx="8" cy="8" r="9.5"/><text class="num" x="8" y="12" text-anchor="middle">1</text>
      <text class="t" x="26" y="12">DSI, never DPI</text>
      <text class="td" x="26" y="29">DPI panels drive GPIO 0–21. I2S lives on 18–21.</text>
      <text class="td" x="26" y="44">You cannot have a DPI screen and a microphone.</text>
    </g>
    <g transform="translate(340,42)">
      <circle class="badge" cx="8" cy="8" r="9.5"/><text class="num" x="8" y="12" text-anchor="middle">2</text>
      <text class="t" x="26" y="12">Bar, not ring</text>
      <text class="td" x="26" y="29">Largest stocked NeoPixel ring is ⌀65.5 outer —</text>
      <text class="td" x="26" y="44">against ⌀87.6 glass it sits behind the screen.</text>
    </g>
    <g transform="translate(680,42)">
      <circle class="badge" cx="8" cy="8" r="9.5"/><text class="num" x="8" y="12" text-anchor="middle">3</text>
      <text class="t" x="26" y="12">The display sets the size</text>
      <text class="td" x="26" y="29">A 115 carrier eats 115 of a 125 face. The bar and</text>
      <text class="td" x="26" y="44">speaker had to move to a 46 skirt → 165 tall.</text>
    </g>

    <g transform="translate(0,112)">
      <circle class="badge" cx="8" cy="8" r="9.5"/><text class="num" x="8" y="12" text-anchor="middle">4</text>
      <text class="t" x="26" y="12">Vents rear-only</text>
      <text class="td" x="26" y="29">Front or top vents are acoustic leak paths from</text>
      <text class="td" x="26" y="44">the driver straight into the mic array.</text>
    </g>
    <g transform="translate(340,112)">
      <circle class="badge" cx="8" cy="8" r="9.5"/><text class="num" x="8" y="12" text-anchor="middle">5</text>
      <text class="t" x="26" y="12">Speaker chamber sealed</text>
      <text class="td" x="26" y="29">Interior SPL reaches ~130 dB and saturates a MEMS</text>
      <text class="td" x="26" y="44">capsule. No software recovers from that.</text>
    </g>
    <g transform="translate(680,112)">
      <circle class="badge" cx="8" cy="8" r="9.5"/><text class="num" x="8" y="12" text-anchor="middle">6</text>
      <text class="t" x="26" y="12">Mics ⌀73 on FPC, pushed back 16</text>
      <text class="td" x="26" y="29">reSpeaker Flex splits array from core board, so it</text>
      <text class="td" x="26" y="44">mounts flat under the top face.</text>
    </g>

    <line class="fr" x1="0" y1="180" x2="1000" y2="180"/>
    <text class="td" x="0" y="201">WALL 2.4 · R9 · PETG · PRINT SHELL RAKED-FACE-DOWN · TRANSLUCENT PETG FOR THE BAR DIFFUSER</text>
    <text class="td" x="1000" y="201" text-anchor="end">cad/you2.scad rev C · cad/renders · cad/stl</text>
  </g>
</svg>
